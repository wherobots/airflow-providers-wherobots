name: CI for unit testing

on:
  workflow_call:

jobs:
  execute-tests:
    name: Run tests (Airflow ${{ matrix.airflow }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # "locked" is the Airflow version pinned in uv.lock (the dev group).
          # The others install that Airflow release on top of the Airflow-free
          # `test` group, so they never touch the lockfile. Tests run as
          # `python -m pytest` so they use the overlay interpreter.
          - airflow: locked
            python: "3.12"
            integration: true
          - airflow: locked
            python: "3.10"
          - airflow: "3.0.*"
            python: "3.12"
          - airflow: "2.11.*"
            python: "3.12"
            integration: true
          - airflow: "2.10.*"
            python: "3.12"
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.12"
      - name: Select Airflow version
        shell: bash
        run: |
          if [ "${{ matrix.airflow }}" = "locked" ]; then
            echo "UV_RUN_ARGS=--locked" >> "$GITHUB_ENV"
          else
            echo "UV_RUN_ARGS=--locked --no-default-groups --group test --with apache-airflow==${{ matrix.airflow }} --with apache-airflow-providers-common-sql" >> "$GITHUB_ENV"
          fi
      - name: Show Airflow version
        run: uv run $UV_RUN_ARGS python -c "import airflow; print(airflow.__version__)"
        shell: bash
      - name: Unit tests
        run: uv run $UV_RUN_ARGS python -m pytest tests/unit_tests --disable-warnings --full-trace
        shell: bash
      - name: Integration tests
        if: ${{ matrix.integration }}
        run: uv run $UV_RUN_ARGS python -m pytest tests/integration_tests --disable-warnings --full-trace
        shell: bash
        env:
          PROD_API_TOKEN: ${{ secrets.PROD_API_TOKEN }}
