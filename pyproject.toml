[project]
name = "airflow-providers-wherobots"
version = "1.8.1"
description = "Airflow extension for communicating with Wherobots Cloud"
authors = [{ name = "zongsi.zhang", email = "zongsi@wherobots.com" }]
requires-python = ">=3.10, <3.13"
readme = "README.md"
dependencies = [
    "wherobots-python-dbapi>=0.28.1",
    "pydantic~=2.3",
]

[project.urls]
Homepage = "https://github.com/wherobots/airflow-provider-wherobots"
Tracker = "https://github.com/wherobots/airflow-provider-wherobots"

[dependency-groups]
# Airflow itself is not a runtime dependency: users bring their own Airflow.
# `test` holds the Airflow-agnostic tooling so CI can run the suite against
# other Airflow versions (see .github/workflows/run_tests.yaml); `dev` adds the
# Airflow version pinned in uv.lock.
test = [
    "pytest>=9.0.3,<10",
    "requests-mock>=1.12.1,<2",
    "aioresponses>=0.7.9,<0.8",
    "pytest-asyncio>=1.4.1,<2",
    "responses>=0.26.3,<0.27",
    "pytest-mock>=3.17.0,<4",
    "polyfactory>=3.5.0,<4",
]
dev = [
    { include-group = "test" },
    "apache-airflow>=3.3.1,<4",
    "apache-airflow-providers-common-sql>=1.20",
    "mypy>=2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
